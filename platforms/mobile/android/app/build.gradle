apply plugin: 'com.android.application'

// Release signing. The keystore and its passwords live outside the repo,
// described by android/keystore.properties (gitignored). When that file is
// absent (fresh clone, CI without the secret), the release build stays
// unsigned rather than failing — signing is wired only when the key is present.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// The tunnel, a component of the platform (platforms/tunnel/component.json): the version this
// APK expects and each library's sha256, read by TunnelComponent.
def tunnelComponent = new groovy.json.JsonSlurper().parse(file('../../../tunnel/component.json'))
// The local AI engine for Android (platforms/ai-engine/component.json, "android"): its libraries' sha256 pinned here.
def aiEngine = new groovy.json.JsonSlurper().parse(file('../../../ai-engine/component.json')).android

android {
    namespace = "cxxi.hub"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        buildConfigField "int", "TUNNEL_VERSION", "${tunnelComponent.version}"
        buildConfigField "String", "TUNNEL_URL", "\"${tunnelComponent.url}\""
        buildConfigField "String", "TUNNEL_ARM64_ASSET", "\"${tunnelComponent.files['android-arm64-v8a'].asset}\""
        buildConfigField "String", "TUNNEL_ARM64_SHA256", "\"${tunnelComponent.files['android-arm64-v8a'].sha256}\""
        buildConfigField "String", "TUNNEL_X86_64_ASSET", "\"${tunnelComponent.files['android-x86_64'].asset}\""
        buildConfigField "String", "TUNNEL_X86_64_SHA256", "\"${tunnelComponent.files['android-x86_64'].sha256}\""
        buildConfigField "int", "AI_ENGINE_VERSION", "${aiEngine.version}"
        buildConfigField "String", "AI_ENGINE_URL", "\"${aiEngine.url}\""
        buildConfigField "String", "AI_TEXT_ASSET", "\"${aiEngine.files['text'].asset}\""
        buildConfigField "String", "AI_TEXT_SHA256", "\"${aiEngine.files['text'].sha256}\""
        buildConfigField "String", "AI_VOICE_ASSET", "\"${aiEngine.files['voice'].asset}\""
        buildConfigField "String", "AI_VOICE_SHA256", "\"${aiEngine.files['voice'].sha256}\""
        applicationId "cxxi.hub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable from CI: ./gradlew ... -PversionCode=N -PversionName=X.Y.Z
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Embedded WireGuard tunnel, built from mobile/tunnel by mobile/scripts/build-tunnel.sh.
    implementation files('libs/tunnel.aar')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Push: the app's notifications by Firebase Cloud Messaging (google-services.json)
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
